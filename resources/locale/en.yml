flarum-gdpr:
  lib:
    data:
      scavengerhunt:
        export_description: Exports the parts the user found, the hunts they completed and the parts they were shown.
        anonymize_description: Deletes the record of the parts the user was shown. Found parts and completed hunts are kept under the anonymized account.
        delete_description: Deletes the parts the user found, the hunts they completed and the record of the parts they were shown.
